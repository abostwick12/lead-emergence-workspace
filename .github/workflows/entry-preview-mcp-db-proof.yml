name: Entry Preview MCP packet disposable proof
on:
  push:
    branches: [codex/entry-dev-preview-mcp-db-proof]
permissions:
  contents: read
jobs:
  database-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout frozen correction source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install official pinned Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.119.0
      - name: Prepare fresh local-only project
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ${{ github.sha }}
          mkdir -p "$RUNNER_TEMP/preview-mcp-local" "$RUNNER_TEMP/preview-mcp-evidence"
          supabase init --workdir "$RUNNER_TEMP/preview-mcp-local" > "$RUNNER_TEMP/preview-mcp-init.log" 2>&1
          python3 - "$RUNNER_TEMP/preview-mcp-local/supabase/config.toml" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          content = path.read_text()
          content, version_count = re.subn(r'(?m)^major_version\s*=\s*\d+', 'major_version = 15', content)
          assert version_count == 1
          content, seed_count = re.subn(r'(\[db\.seed\]\s*\n)([\s\S]*?)(?=\n\[)', lambda match: match[1] + re.sub(r'(?m)^enabled\s*=\s*true', 'enabled = false', match[2]), content)
          assert seed_count == 1 and re.search(r'\[db\.seed\]\s*\n[\s\S]*?^enabled = false$', content, re.M)
          path.write_text(content)
          PY
          cp -R supabase/migrations "$RUNNER_TEMP/preview-mcp-local/supabase/"
          rm "$RUNNER_TEMP/preview-mcp-local/supabase/migrations/20261009180000_entry_dev_preview_mcp_resource_review.sql"
          mkdir -p "$RUNNER_TEMP/preview-mcp-local/supabase/tests/database"
          cp supabase/tests/database/entry_dev_preview_mcp_resource.sql "$RUNNER_TEMP/preview-mcp-local/supabase/tests/database/"
          cmp supabase/tests/database/entry_dev_preview_mcp_resource.sql "$RUNNER_TEMP/preview-mcp-local/supabase/tests/database/entry_dev_preview_mcp_resource.sql"
          echo '6cd9a21389f0b6a3a40416aa0ad02443ab354cca9c506be5b186957c113ad0d3  supabase/migrations/20261009180000_entry_dev_preview_mcp_resource_review.sql' | sha256sum -c -
          echo '6417a1381c6434ab186da832b89a4d781a234c32bbb0058f909c0151f7c7a9d7  supabase/tests/database/entry_dev_preview_mcp_resource.sql' | sha256sum -c -
      - name: Start official ephemeral local stack
        shell: bash
        run: |
          set -euo pipefail
          if ! supabase start --workdir "$RUNNER_TEMP/preview-mcp-local" > "$RUNNER_TEMP/preview-mcp-start-private.log" 2>&1; then
            python3 - "$RUNNER_TEMP/preview-mcp-start-private.log" <<'PY'
          import pathlib, re, sys
          for line in pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines():
              if re.search(r'error|fatal|failed|migration|syntax|permission denied', line, re.I):
                  line = re.sub(r'eyJ[A-Za-z0-9_.-]+', '[REDACTED]', line)
                  line = re.sub(r'postgres(?:ql)?://[^\s]+', '[REDACTED LOCAL CONNECTION]', line)
                  line = re.sub(r'(?i)((?:secret|password|api.?key|token)\s*[:=]\s*)\S+', r'\1[REDACTED]', line)
                  print(line)
          PY
            exit 1
          fi
      - name: Execute fixture-adapted operator and guard proof
        shell: bash
        run: |
          set -euo pipefail
          echo '97bb3097cba806bdd19a895c41af8985ef436c0349d7e9e69075ffc112770538  proof/package/operator-apply.sql' | sha256sum -c -
          echo '6cd9a21389f0b6a3a40416aa0ad02443ab354cca9c506be5b186957c113ad0d3  proof/package/source/20261009180000_entry_dev_preview_mcp_resource_review.sql' | sha256sum -c -
          python3 proof/verify-preview-packet.py
      - name: Stop disposable local stack
        if: always()
        shell: bash
        run: |
          supabase stop --workdir "$RUNNER_TEMP/preview-mcp-local" > "$RUNNER_TEMP/preview-mcp-stop-private.log" 2>&1
          echo 'Disposable local stack stopped.'
